<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0F1E36">
    <title>You’re offline | CHUSBC</title>
    <style>
        :root { --navy: #0F1E36; --navy-light: #1A3154; --navy-dark: #091221; --gold: #F2C230; --slatebg: #F4F6F9; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: var(--slatebg);
            color: var(--navy);
            font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            text-align: center;
        }
        .card {
            max-width: 28rem;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-top: 4px solid var(--gold);
            border-radius: 1rem;
            padding: 2rem 1.5rem 1.75rem;
            box-shadow: 0 10px 30px rgba(15, 30, 54, 0.08);
        }
        .mark {
            width: 56px;
            height: 56px;
            margin: 0 auto 1rem;
            border-radius: 12px;
            background: var(--navy);
            color: var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            letter-spacing: 0.04em;
            font-size: 0.7rem;
        }
        h1 {
            margin: 0 0 0.5rem;
            font-family: Oswald, "Plus Jakarta Sans", sans-serif;
            font-size: 1.75rem;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }
        p { margin: 0 0 1.25rem; color: #475569; line-height: 1.5; font-size: 0.95rem; }
        a, button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--gold);
            color: var(--navy);
            font-weight: 700;
            text-decoration: none;
            border: 0;
            border-radius: 0.75rem;
            padding: 0.75rem 1.15rem;
            cursor: pointer;
            font-size: 0.9rem;
            font-family: inherit;
        }
        a:hover, button:hover { filter: brightness(0.97); }
    </style>
</head>
<body>
    <div class="card">
        <div class="mark" aria-hidden="true">CHUSBC</div>
        <h1>You’re offline</h1>
        <p>The Cecil Harford USBC site can’t be reached right now. Check your connection and try again. Pages you’ve already visited may still be available.</p>
        <p>
            <a href="./">Back to CHUSBC</a>
        </p>
        <p style="margin-bottom:0">
            <button type="button" onclick="location.reload()">Try again</button>
        </p>
    </div>
</body>
</html>
